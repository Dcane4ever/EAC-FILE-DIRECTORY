# Local click-through testing profile ONLY. Activate with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=test
# Swaps Google OAuth2 login for a simple @eac.edu.ph email form at /dev-login
# (see ph.edu.eac.filedirectory.devauth). Everything else (DB, storage,
