spring.application.name=filedirectory
server.port=8084

# --- Database (new, dedicated eac_directory schema; separate from eacdb) ---
spring.datasource.url=jdbc:mysql://localhost:3306/eac_directory?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Google OAuth2 ---
# Real values come from env vars (see .env.example). Placeholders below let the
# app boot and the login page render even before real Google Cloud credentials
# exist - clicking "Sign in with Google" will fail until real values are set.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# --- File storage (local disk) ---
eac.storage.root=./data/eac-directory

# --- Access control ---
eac.allowed-email-domain=eac.edu.ph

# --- Upload limits ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
