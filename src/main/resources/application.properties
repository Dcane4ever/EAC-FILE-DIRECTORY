spring.application.name=filedirectory
server.port=8084

# Loads repo-root .env (MAIL_USERNAME, MAIL_APP_PASSWORD, etc.) as extra
# properties, using Spring Boot's own config-import mechanism - no separate
# dotenv library needed. "optional:" means boot doesn't fail if .env is
# missing (e.g. on a fresh checkout before it's been created from
# .env.example). Values are then referenced below as ${MAIL_USERNAME:...}
# etc. exactly like plain environment variables.
spring.config.import=optional:file:.env[.properties]

# --- Database (new, dedicated eac_directory schema; separate from eacdb) ---
spring.datasource.url=jdbc:mysql://localhost:3306/eac_directory?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Mail (registration email verification, Gmail SMTP) ---
# Real values come from env vars (see .env.example) - a Gmail address + an
# App Password (not the account's login password) generated from the Google
# Account's security settings. Sending fails until real values are set, but
# the app still boots.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
eac.mail.from=${MAIL_USERNAME:}
eac.mail.verification-token-ttl-hours=24
# Password reset links grant account takeover (not just email confirmation
# like verification), so they get a much shorter window.
eac.mail.password-reset-token-ttl-minutes=60
# Minimum time between two verification-resend or reset requests for the same
# account, so refreshing the page repeatedly doesn't spam their inbox or spin
# up unbounded token rows. Real rate limiting is a separate, larger piece of
# work (see roadmap Phase 3) - this is just a floor until that lands.
eac.mail.resend-cooldown-minutes=2
# Base URL used to build the verification/reset links sent by email.
eac.app.base-url=${APP_BASE_URL:http://localhost:8084}

# --- File storage (local disk) ---
eac.storage.root=./data/eac-directory

# --- Access requests (Phase 9) ---
# How long an approved download link stays usable, from the moment it's granted.
eac.access.grant-token-ttl-hours=6
# How many days a request can sit with no uploader response before a
# moderator/admin may step in - only takes effect if an admin has also
# enabled SystemSetting.allowModeratorAccessRequestFallback (default off).
eac.access.moderator-fallback-days=7

# --- Access control ---
eac.allowed-email-domain=eac.edu.ph

# --- Upload limits ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- ONLYOFFICE preview (Office document preview: DOCX/DOC/PPTX/PPT/XLSX/XLS) ---
# ONLYOFFICE Document Server is a separate service, not part of this WAR/
# Tomcat deployment - see docker-compose.yml for local dev, and
# OnlyOfficeService's class comment for why browser-facing and
# server-facing URLs are two different settings, not one.
#
# onlyoffice.url: what the USER'S BROWSER loads the viewer API script from.
# Local dev default matches docker-compose.yml's published port.
onlyoffice.url=${ONLYOFFICE_URL:http://localhost:8085}
# onlyoffice.jwt.enabled / onlyoffice.jwt.secret: must match the Document
# Server's own JWT_ENABLED/JWT_SECRET (see docker-compose.yml). Never commit
# a real secret - ONLYOFFICE_JWT_SECRET comes from .env (gitignored) or a
# real environment variable in production.
onlyoffice.jwt.enabled=${ONLYOFFICE_JWT_ENABLED:true}
onlyoffice.jwt.secret=${ONLYOFFICE_JWT_SECRET:}
# onlyoffice.app-base-url: what the DOCUMENT SERVER (not the browser) uses to
# fetch the actual file bytes and deliver its callback - reuses
# eac.app.base-url by default since in the common case (same host, ONLYOFFICE
# just on a different port/container) they're the same address. Override
# separately only when ONLYOFFICE genuinely can't reach the app at that URL
# (e.g. a Docker network where "localhost" means the container itself).
onlyoffice.app-base-url=${ONLYOFFICE_APP_BASE_URL:${eac.app.base-url}}
# How long a signed document-content URL stays usable - short, since it only
# needs to survive the few seconds between issuing the preview config and
# the Document Server actually fetching the file (same TTL philosophy as
# eac.access.grant-token-ttl-hours, just a much shorter window because this
# is a machine-to-machine fetch, not something a person holds onto).
onlyoffice.document-token-ttl-minutes=5
