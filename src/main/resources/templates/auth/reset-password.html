<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAC File Directory - Set New Password</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="min-h-screen bg-gradient-to-br from-neutral-100 to-neutral-200 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-10">
        <div class="flex flex-col items-center text-center mb-6">
            <img th:src="@{/images/emblem.png}" alt="EAC" class="w-16 h-16 mb-3">
            <h1 class="text-2xl font-bold text-eac-navy">Set a new password</h1>
            <p class="text-eac-text-light text-sm mt-1">Choose a new password for your account.</p>
        </div>

        <div th:if="${errorMessage}" class="mb-6 flex items-start gap-2 rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm px-4 py-3">
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/reset-password}" method="post" class="space-y-3">
            <input type="hidden" name="token" th:value="${token}">
            <div>
                <label class="block text-sm font-medium text-eac-text mb-1">New Password</label>
                <input type="password" name="password" required minlength="8"
                       class="w-full rounded-lg border border-eac-border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-eac-red/40">
                <p class="text-xs text-eac-text-light mt-1">At least 8 characters.</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-eac-text mb-1">Confirm New Password</label>
                <input type="password" name="confirmPassword" required minlength="8"
                       class="w-full rounded-lg border border-eac-border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-eac-red/40">
            </div>
            <button type="submit" class="w-full bg-eac-red hover:bg-eac-red-hover transition text-white font-semibold py-3 rounded-lg">
                Update Password
            </button>
        </form>

        <p class="text-sm text-eac-text-light mt-6 text-center">
            <a th:href="@{/login}" class="text-eac-red font-medium hover:underline">&larr; Back to Sign In</a>
        </p>
    </div>

</body>
</html>
