<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAC File Directory - Sign In</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="min-h-screen bg-gradient-to-br from-neutral-100 to-neutral-200 flex items-center justify-center p-4">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row">

        <!-- Branding panel -->
        <div class="md:w-1/2 bg-eac-red relative p-10 flex flex-col items-center justify-center text-center text-white"
             style="background: linear-gradient(135deg, #b31217 0%, #8b0e12 100%);">
            <img th:src="@{/images/emblem.png}" alt="Emilio Aguinaldo College" class="w-28 h-28 mb-4 drop-shadow-lg">
            <h2 class="text-2xl font-bold tracking-wide">Emilio Aguinaldo College</h2>
            <p class="text-sm text-red-100 mt-1 mb-6">Excellence in Education</p>

            <div class="rounded-xl overflow-hidden shadow-lg border-4 border-white/20 max-w-xs">
                <img th:src="@{/images/eac-grad.jpg}" alt="Graduation Ceremony" class="w-full h-auto">
            </div>
        </div>

        <!-- Sign-in panel -->
        <div class="md:w-1/2 p-10 flex flex-col justify-center">
            <h1 class="text-3xl font-bold text-eac-navy mb-1">EAC File Directory</h1>
            <p class="text-eac-text-light mb-8">Research, papers, code, and academic resources — all in one place.</p>

            <h2 class="text-xl font-semibold text-eac-text border-b-2 border-eac-red inline-block pb-1 mb-6 w-fit">
                Sign In
            </h2>

            <div th:if="${errorMessage}" class="mb-6 flex items-start gap-2 rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm px-4 py-3">
                <span th:text="${errorMessage}"></span>
            </div>
            <div th:if="${infoMessage}" class="mb-6 flex items-start gap-2 rounded-lg border border-blue-200 bg-blue-50 text-blue-800 text-sm px-4 py-3">
                <span th:text="${infoMessage}"></span>
            </div>

            <a th:href="@{/oauth2/authorization/google}"
               class="flex items-center justify-center gap-3 w-full border border-eac-border rounded-lg px-6 py-3 font-semibold text-eac-text hover:bg-neutral-50 transition shadow-sm">
                <svg class="w-5 h-5" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.5 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6.1 29.5 4 24 4c-7.5 0-13.9 4.2-17.7 10.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.4 0 10.3-1.8 14.1-5l-6.5-5.5C29.6 35 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.9 39.6 16.4 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.5 5.5C40.6 36.6 44 30.9 44 24c0-1.4-.1-2.7-.4-3.5z"/>
                </svg>
                Sign in with Google
            </a>

            <p class="text-xs text-eac-text-light mt-4 text-center">
                Access is restricted to <span class="font-medium">@eac.edu.ph</span> accounts —
                students, faculty, and staff.
            </p>

            <div class="mt-8 pt-6 border-t border-eac-border text-center text-sm text-eac-text-light">
                Trouble signing in? Contact the IT administrator.
            </div>
        </div>
    </div>

</body>
</html>
