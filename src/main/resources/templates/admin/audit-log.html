<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Log - EAC File Directory</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <style>@keyframes admin-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:translate3d(0,0,0)}}.admin-rise{animation:admin-rise 520ms cubic-bezier(.2,.8,.2,1) both}@media(prefers-reduced-motion:reduce){.admin-rise{animation:none}}</style>
</head>
<body class="min-h-screen bg-[#f7f7f8] text-eac-text">
    <div class="min-h-screen lg:grid lg:grid-cols-[272px_1fr]">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 hidden w-[272px] border-r border-eac-border bg-white lg:flex lg:flex-col">
            <div class="flex h-[84px] items-center gap-3 px-6"><img th:src="@{/images/emblem.png}" alt="EAC" class="h-12 w-12 shrink-0"><div class="min-w-0"><p class="truncate text-base font-black text-eac-maroon">EAC File Directory</p><p class="text-xs font-semibold text-eac-red">Admin</p></div></div>
            <nav th:replace="~{fragments/admin-sidebar-nav :: nav('audit', null, false)}"></nav>
            <div class="p-4"><div class="rounded-2xl border border-eac-border bg-eac-bg p-5"><p class="text-xs font-black uppercase tracking-[0.18em] text-eac-red">Audit trail</p><p class="mt-3 text-3xl font-black text-eac-maroon" th:text="${events.totalElements}">0</p><p class="mt-1 text-sm font-semibold text-eac-text-light">recorded event(s)</p></div></div>
        </aside>
        <div id="mobileOverlay" class="fixed inset-0 z-30 hidden bg-black/30 lg:hidden"></div>
        <div class="min-w-0 lg:col-start-2">
            <header class="sticky top-0 z-20 border-b border-eac-border bg-white/95 backdrop-blur">
                <div class="flex h-[84px] items-center justify-between gap-4 px-4 sm:px-6 lg:px-9">
                    <button type="button" id="navToggle" aria-label="Open menu" class="grid h-10 w-10 place-items-center rounded-xl border border-eac-border text-eac-maroon lg:hidden">=</button>
                    <form th:action="@{/admin/users/audit-log}" method="get" class="hidden w-full max-w-xl items-center rounded-2xl border border-eac-border bg-white px-4 py-3 shadow-sm sm:flex">
                        <input type="text" name="actorEmail" th:value="${actorEmail}" placeholder="Search actor email..." class="min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-eac-text-light">
                        <span class="rounded-lg border border-eac-border px-2 py-1 text-xs font-bold text-eac-text-light">Audit</span>
                    </form>
                    <form th:action="@{/logout}" method="post" class="ml-auto"><button type="submit" class="rounded-xl bg-eac-red px-4 py-2.5 text-sm font-bold text-white transition hover:bg-eac-red-hover">Sign Out</button></form>
                </div>
            </header>
            <main class="admin-rise px-4 py-8 sm:px-6 lg:px-9 lg:py-10">
                <section class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
                    <div><p class="text-xs font-black uppercase tracking-[0.18em] text-eac-red">System activity</p><h1 class="mt-3 text-3xl font-black text-eac-text sm:text-4xl">Audit Log</h1><p class="mt-2 text-base font-medium text-eac-text-light" th:text="${events.totalElements} + ' event(s)'">0 event(s)</p></div>
                </section>
                <form th:action="@{/admin/users/audit-log}" method="get" class="mt-7 grid gap-3 rounded-2xl border border-eac-border bg-white p-5 shadow-sm sm:p-6 lg:grid-cols-5">
                    <div><label class="mb-1 block text-xs font-black uppercase tracking-wide text-eac-text-light">Actor email</label><input type="text" name="actorEmail" th:value="${actorEmail}" placeholder="name@eac.edu.ph" class="w-full rounded-lg border border-eac-border px-3 py-2 text-sm outline-none focus:border-eac-red focus:ring-2 focus:ring-eac-red/20"></div>
                    <div><label class="mb-1 block text-xs font-black uppercase tracking-wide text-eac-text-light">Action</label><select name="action" class="w-full rounded-lg border border-eac-border px-3 py-2 text-sm outline-none focus:border-eac-red focus:ring-2 focus:ring-eac-red/20"><option value="">All actions</option><option th:each="a : ${actions}" th:value="${a}" th:text="${a}" th:selected="${a == selectedAction}"></option></select></div>
                    <div><label class="mb-1 block text-xs font-black uppercase tracking-wide text-eac-text-light">Target type</label><select name="targetType" class="w-full rounded-lg border border-eac-border px-3 py-2 text-sm outline-none focus:border-eac-red focus:ring-2 focus:ring-eac-red/20"><option value="">All types</option><option th:each="t : ${targetTypes}" th:value="${t}" th:text="${t}" th:selected="${t == selectedTargetType}"></option></select></div>
                    <div><label class="mb-1 block text-xs font-black uppercase tracking-wide text-eac-text-light">From</label><input type="date" name="from" th:value="${from}" class="w-full rounded-lg border border-eac-border px-3 py-2 text-sm outline-none focus:border-eac-red focus:ring-2 focus:ring-eac-red/20"></div>
                    <div><label class="mb-1 block text-xs font-black uppercase tracking-wide text-eac-text-light">To</label><input type="date" name="to" th:value="${to}" class="w-full rounded-lg border border-eac-border px-3 py-2 text-sm outline-none focus:border-eac-red focus:ring-2 focus:ring-eac-red/20"></div>
                    <div class="flex items-center gap-3 lg:col-span-5"><button type="submit" class="rounded-lg bg-eac-red px-5 py-2.5 text-sm font-bold text-white hover:bg-eac-red-hover">Apply Filters</button><a th:href="@{/admin/users/audit-log}" class="text-sm font-bold text-eac-text-light hover:text-eac-red">Clear</a></div>
                </form>
                <div th:if="${events.empty}" class="mt-6 rounded-2xl border border-dashed border-eac-border bg-white p-10 text-center"><p class="font-black text-eac-text">No matching events.</p></div>
                <section th:unless="${events.empty}" class="mt-6 overflow-hidden rounded-2xl border border-eac-border bg-white shadow-sm">
                    <div class="overflow-x-auto"><table class="min-w-full text-left text-sm">
                        <thead class="text-xs uppercase tracking-wide text-eac-text-light"><tr class="border-b border-eac-border"><th class="px-4 py-3 font-black">When</th><th class="px-4 py-3 font-black">Action</th><th class="px-4 py-3 font-black">Actor</th><th class="px-4 py-3 font-black">Target</th><th class="px-4 py-3 font-black">Details</th><th class="px-4 py-3 font-black">IP</th></tr></thead>
                        <tbody class="divide-y divide-eac-border"><tr th:each="e : ${events.content}" class="align-top transition hover:bg-eac-bg/70">
                            <td class="whitespace-nowrap px-4 py-4 text-eac-text-light" th:text="${#temporals.format(e.createdAt, 'MMM d, yyyy h:mm:ss a')}">Date</td>
                            <td class="px-4 py-4"><span class="rounded-full px-3 py-1 text-xs font-black" th:classappend="${#strings.contains(e.action.name(), 'FAILURE') or #strings.contains(e.action.name(), 'REJECTED') ? ' bg-red-100 text-red-700' : (#strings.contains(e.action.name(), 'APPROVED') or #strings.contains(e.action.name(), 'SUCCESS') ? ' bg-green-100 text-green-700' : ' bg-eac-red-soft text-eac-red')}" th:text="${e.action}">ACTION</span></td>
                            <td class="whitespace-nowrap px-4 py-4 font-semibold text-eac-text" th:text="${e.actorEmail} ?: 'None'">Actor</td>
                            <td class="whitespace-nowrap px-4 py-4 text-eac-text-light"><span th:if="${e.targetType.name() != 'NONE'}" th:text="${e.targetType} + ' #' + ${e.targetId}"></span><span th:unless="${e.targetType.name() != 'NONE'}">None</span></td>
                            <td class="px-4 py-4 text-eac-text-light"><div th:if="${e.metadata}" th:text="${e.metadata}"></div><div th:if="${e.previousValue != null or e.newValue != null}" class="mt-1 text-xs"><span th:if="${e.previousValue}" th:text="${e.previousValue}"></span><span th:if="${e.previousValue != null and e.newValue != null}"> to </span><span th:if="${e.newValue}" th:text="${e.newValue}"></span></div><div th:if="${e.reason}" class="mt-1 text-xs italic" th:text="'Reason: ' + ${e.reason}"></div></td>
                            <td class="whitespace-nowrap px-4 py-4 text-eac-text-light" th:text="${e.ipAddress} ?: 'None'">IP</td>
                        </tr></tbody>
                    </table></div>
                </section>
                <div class="mt-8 flex items-center justify-center gap-2" th:if="${events.totalPages > 1}"><a th:each="p : ${#numbers.sequence(0, events.totalPages - 1)}" th:href="@{/admin/users/audit-log(page=${p}, actorEmail=${actorEmail}, action=${selectedAction}, targetType=${selectedTargetType}, from=${from}, to=${to})}" th:text="${p + 1}" th:classappend="${p == events.number} ? 'bg-eac-red text-white' : 'bg-white text-eac-text border border-eac-border hover:border-eac-red'" class="flex h-9 w-9 items-center justify-center rounded-lg text-sm font-bold transition"></a></div>
            </main>
        </div>
    </div>
    <script>var sidebar=document.getElementById('sidebar'),navToggle=document.getElementById('navToggle'),overlay=document.getElementById('mobileOverlay');function openSidebar(){sidebar.classList.remove('hidden');sidebar.classList.add('flex');overlay.classList.remove('hidden')}function closeSidebar(){sidebar.classList.add('hidden');sidebar.classList.remove('flex');overlay.classList.add('hidden')}if(navToggle&&sidebar&&overlay){navToggle.addEventListener('click',openSidebar);overlay.addEventListener('click',closeSidebar)}</script>
</body>
</html>
