<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approval Queue - EAC File Directory</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="min-h-screen bg-eac-bg">

    <header class="bg-eac-navy text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a th:href="@{/home}" class="flex items-center gap-3">
                <img th:src="@{/images/emblem.png}" alt="EAC" class="w-9 h-9">
                <span class="font-bold text-lg tracking-wide">EAC File Directory <span class="text-eac-red font-normal">Admin</span></span>
            </a>
            <div class="flex items-center gap-4 text-sm">
                <a th:href="@{/browse}" class="hover:text-eac-red transition">Browse</a>
                <a th:href="@{/logout}" class="bg-eac-red hover:bg-eac-red-hover transition rounded-md px-4 py-2 font-medium">Sign Out</a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-10">
        <h1 class="text-2xl font-bold text-eac-navy mb-1">Pending Approval Queue</h1>
        <p class="text-eac-text-light text-sm mb-6" th:text="${files.totalElements} + ' file(s) waiting for review'"></p>

        <div th:if="${infoMessage}" class="mb-4 rounded-lg bg-green-50 border border-green-200 text-green-700 px-4 py-3 text-sm" th:text="${infoMessage}"></div>

        <div th:if="${files.empty}" class="rounded-xl border border-dashed border-eac-border bg-white p-10 text-center text-eac-text-light">
            <p class="font-medium">Nothing pending. Queue is clear.</p>
        </div>

        <div class="space-y-4" th:unless="${files.empty}">
            <div th:each="file : ${files.content}" class="bg-white rounded-xl border border-eac-border p-6">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-2 text-xs text-eac-text-light mb-1">
                            <span class="bg-eac-navy/5 text-eac-navy px-2 py-0.5 rounded font-medium" th:text="${file.category.name}"></span>
                            <span th:text="${file.department.name}"></span>
                        </div>
                        <h3 class="font-semibold text-eac-text" th:text="${file.title}"></h3>
                        <p class="text-sm text-eac-text-light mt-1" th:text="${file.description}"></p>
                        <p class="text-xs text-eac-text-light mt-2">
                            <span th:text="${file.uploader.fullName} + ' (' + ${file.uploader.email} + ')'"></span>
                            &middot;
                            <span th:text="${#temporals.format(file.createdAt, 'MMM d, yyyy HH:mm')}"></span>
                            &middot;
                            <span th:text="${#numbers.formatDecimal(file.fileSize / 1024.0 / 1024.0, 1, 2)} + ' MB'"></span>
                        </p>
                    </div>
                    <a th:href="@{/files/{id}(id=${file.id})}" class="text-sm text-eac-red hover:underline whitespace-nowrap">Preview &rarr;</a>
                </div>

                <div class="flex items-center gap-3 mt-4 pt-4 border-t border-eac-border">
                    <form th:action="@{/admin/files/{id}/approve(id=${file.id})}" method="post">
                        <button type="submit" class="bg-green-600 hover:bg-green-700 transition text-white text-sm font-semibold px-4 py-2 rounded-lg">
                            Approve
                        </button>
                    </form>
                    <form th:action="@{/admin/files/{id}/reject(id=${file.id})}" method="post" class="flex items-center gap-2 flex-1">
                        <input type="text" name="reason" placeholder="Rejection reason (optional)"
                               class="flex-1 rounded-lg border border-eac-border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-eac-red/40">
                        <button type="submit" class="bg-white border border-red-300 text-red-600 hover:bg-red-50 transition text-sm font-semibold px-4 py-2 rounded-lg">
                            Reject
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="flex items-center justify-center gap-2 mt-8" th:if="${files.totalPages > 1}">
            <a th:each="p : ${#numbers.sequence(0, files.totalPages - 1)}"
               th:href="@{/admin/queue(page=${p})}"
               th:text="${p + 1}"
               th:classappend="${p == files.number} ? 'bg-eac-red text-white' : 'bg-white text-eac-text border border-eac-border hover:border-eac-red'"
               class="w-9 h-9 flex items-center justify-center rounded-md text-sm transition"></a>
        </div>
    </main>

</body>
</html>
