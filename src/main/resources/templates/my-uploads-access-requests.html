<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Requests - EAC File Directory</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="min-h-screen bg-eac-bg">

    <header class="bg-white border-b border-eac-border relative">
        <div class="max-w-7xl mx-auto px-6 h-[72px] flex items-center justify-between">
            <a th:href="@{/home}" class="flex items-center gap-3 shrink-0">
                <img th:src="@{/images/emblem.png}" alt="EAC" class="w-10 h-10">
                <span class="font-bold text-lg text-eac-maroon whitespace-nowrap">EAC File Directory</span>
            </a>
            <nav class="hidden lg:flex items-center gap-7 text-sm font-medium">
                <a th:href="@{/browse}" class="text-eac-text hover:text-eac-red transition">Browse</a>
                <a th:href="@{/upload}" class="text-eac-text hover:text-eac-red transition">Upload</a>
                <a th:href="@{/my-uploads}" class="text-eac-red font-semibold">My Uploads</a>
                <a th:href="@{/my-requests}" class="text-eac-text hover:text-eac-red transition">My Requests</a>
                <a th:href="@{/notifications}" class="relative text-eac-text hover:text-eac-red transition">
                    Notifications
                    <span th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}"
                          class="absolute -top-2 -right-3 bg-eac-red text-white text-[10px] font-bold rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center"></span>
                </a>
                <div class="h-6 w-px bg-eac-border"></div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="bg-eac-red hover:bg-eac-red-hover transition text-white text-sm font-bold rounded-lg px-5 py-2.5">Sign Out</button>
                </form>
            </nav>
            <button type="button" id="navToggle" aria-label="Toggle menu" class="lg:hidden text-eac-maroon p-2 -mr-2">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>
        </div>
        <div id="navPanel" class="hidden lg:hidden border-t border-eac-border bg-white px-6 py-4 space-y-3 text-sm font-medium">
            <a th:href="@{/browse}" class="block text-eac-text hover:text-eac-red transition">Browse</a>
            <a th:href="@{/upload}" class="block text-eac-text hover:text-eac-red transition">Upload</a>
            <a th:href="@{/my-uploads}" class="block text-eac-red font-semibold">My Uploads</a>
            <a th:href="@{/my-requests}" class="block text-eac-text hover:text-eac-red transition">My Requests</a>
            <a th:href="@{/notifications}" class="block text-eac-text hover:text-eac-red transition">
                Notifications
                <span th:if="${unreadNotificationCount > 0}" th:text="'(' + ${unreadNotificationCount} + ')'" class="text-eac-red font-semibold"></span>
            </a>
            <form th:action="@{/logout}" method="post" class="mt-2">
                <button type="submit" class="w-full bg-eac-red hover:bg-eac-red-hover transition text-white text-sm font-bold rounded-lg px-5 py-2.5">Sign Out</button>
            </form>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-10">
        <a th:href="@{/my-uploads}" class="text-sm text-eac-text-light hover:text-eac-red">&larr; Back to My Uploads</a>

        <div class="flex items-center gap-3 mt-4 mb-1">
            <h1 class="text-2xl font-bold text-eac-navy">Access Requests</h1>
            <span th:if="${pendingCount > 0}" th:text="${pendingCount} + ' pending'"
                  class="text-xs font-semibold bg-eac-red text-white rounded-full px-3 py-1 whitespace-nowrap"></span>
        </div>
        <p class="text-eac-text-light text-sm mb-6">People who've asked to download files you uploaded.</p>

        <div th:if="${infoMessage}" class="mb-4 rounded-lg bg-green-50 border border-green-200 text-green-700 px-4 py-3 text-sm" th:text="${infoMessage}"></div>
        <div th:if="${errorMessage}" class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 px-4 py-3 text-sm" th:text="${errorMessage}"></div>

        <div th:if="${requests.empty}" class="rounded-xl border border-dashed border-eac-border bg-white p-10 text-center text-eac-text-light">
            <p class="font-medium">No one has requested access to your uploads yet.</p>
        </div>

        <div class="space-y-3" th:unless="${requests.empty}">
            <div th:each="req : ${requests.content}" class="bg-white rounded-xl border border-eac-border p-5">
                <div class="flex items-start justify-between gap-4">
                    <div class="min-w-0">
                        <a th:href="@{/files/{id}(id=${req.file.id})}" class="font-semibold text-eac-text hover:text-eac-red transition" th:text="${req.file.title}"></a>
                        <p class="text-sm text-eac-text-light mt-1">
                            Requested by <span class="font-medium text-eac-text" th:text="${req.requester.fullName}"></span>
                            &middot; <span th:text="${#temporals.format(req.createdAt, 'MMM d, yyyy')}"></span>
                        </p>
                        <p th:if="${req.status.name() == 'DENIED' and req.decisionNote != null}"
                           class="text-xs text-red-600 mt-1" th:text="'Reason: ' + ${req.decisionNote}"></p>
                    </div>
                    <span class="shrink-0 text-xs font-semibold px-3 py-1 rounded-full whitespace-nowrap"
                          th:classappend="${req.status.name() == 'APPROVED'} ? 'bg-green-100 text-green-700' : (${req.status.name() == 'DENIED'} ? 'bg-red-100 text-red-700' : (${req.status.name() == 'EXPIRED'} ? 'bg-gray-100 text-gray-600' : 'bg-amber-100 text-amber-700'))"
                          th:text="${req.status}"></span>
                </div>

                <div th:if="${req.status.name() == 'PENDING'}" class="flex items-center gap-3 mt-4 pt-4 border-t border-eac-border">
                    <form th:action="@{/files/access-requests/{id}/approve(id=${req.id})}" method="post">
                        <button type="submit" class="text-sm font-semibold bg-eac-red hover:bg-eac-red-hover transition text-white rounded-lg px-4 py-2">Approve</button>
                    </form>
                    <button type="button" class="deny-toggle text-sm font-semibold text-eac-text-light hover:text-eac-red transition px-4 py-2" th:attr="data-target='deny-form-' + ${req.id}">Deny</button>
                </div>

                <form th:if="${req.status.name() == 'PENDING'}" th:id="'deny-form-' + ${req.id}"
                      th:action="@{/files/access-requests/{id}/deny(id=${req.id})}" method="post"
                      class="hidden mt-3 items-center gap-2">
                    <input type="text" name="reason" placeholder="Reason (optional)" maxlength="500"
                           class="flex-1 border border-eac-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-eac-red/50">
                    <button type="submit" class="text-sm font-semibold bg-eac-text hover:bg-eac-text/90 transition text-white rounded-lg px-4 py-2 whitespace-nowrap">Confirm Deny</button>
                </form>
            </div>
        </div>

        <div th:if="${requests.totalPages > 1}" class="flex items-center justify-center gap-2 mt-8 text-sm">
            <a th:if="${!requests.first}" th:href="@{/my-uploads/access-requests(page=${requests.number - 1})}"
               class="px-3 py-1.5 rounded-lg border border-eac-border text-eac-text hover:border-eac-red/40 transition">Previous</a>
            <span class="text-eac-text-light" th:text="'Page ' + (${requests.number} + 1) + ' of ' + ${requests.totalPages}"></span>
            <a th:if="${!requests.last}" th:href="@{/my-uploads/access-requests(page=${requests.number + 1})}"
               class="px-3 py-1.5 rounded-lg border border-eac-border text-eac-text hover:border-eac-red/40 transition">Next</a>
        </div>
    </main>

    <script>
        var navToggle = document.getElementById('navToggle');
        var navPanel = document.getElementById('navPanel');
        if (navToggle && navPanel) {
            navToggle.addEventListener('click', function () {
                navPanel.classList.toggle('hidden');
            });
        }

        document.querySelectorAll('.deny-toggle').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var target = document.getElementById(btn.dataset.target);
                if (target) {
                    target.classList.toggle('hidden');
                    target.classList.toggle('flex');
                }
            });
        });
    </script>

</body>
</html>
