<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Edit metadata - ' + ${file.title}">Edit metadata - EAC File Directory</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="min-h-screen bg-eac-bg text-eac-text">

    <header th:replace="~{fragments/user-header :: header('uploads')}"></header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
        <a th:href="@{/files/{id}(id=${file.id},returnTo=${returnTo})}" class="inline-flex items-center gap-2 text-sm font-semibold text-eac-red hover:text-eac-red-hover transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Back to file
        </a>

        <section class="mt-5 overflow-hidden rounded-2xl border border-eac-border bg-white shadow-sm">
            <div class="bg-[linear-gradient(115deg,#6b1118_0%,#8b0e12_55%,#b31217_100%)] px-6 py-8 text-white sm:px-8">
                <p class="text-sm font-black uppercase tracking-[0.22em] text-white/70">Record editor</p>
                <div class="mt-3 grid gap-6 lg:grid-cols-[1fr_280px] lg:items-end">
                    <div>
                        <h1 class="max-w-3xl text-4xl font-black leading-tight sm:text-5xl">Edit file metadata</h1>
                        <p class="mt-3 max-w-2xl text-base font-medium leading-7 text-white/78">Update the academic record details without replacing or modifying the uploaded file.</p>
                    </div>
                    <div class="rounded-2xl border border-white/16 bg-white/12 p-5 backdrop-blur">
                        <p class="text-xs font-black uppercase tracking-[0.18em] text-white/60" th:text="${#strings.toUpperCase(file.extension())}">PDF</p>
                        <p class="mt-2 break-all text-sm font-semibold text-white/86" th:text="${file.originalFilename}">file.pdf</p>
                    </div>
                </div>
            </div>

            <form th:action="@{/files/{id}/edit(id=${file.id})}" method="post" class="p-5 sm:p-7 lg:p-8">
                <input th:if="${returnTo != null}" type="hidden" name="returnTo" th:value="${returnTo}">
                <div th:if="${errorMessage}" class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700" th:text="${errorMessage}"></div>

                <div class="grid gap-6 lg:grid-cols-[1.15fr_0.85fr]">
                    <section class="space-y-5">
                        <div>
                            <label class="mb-1.5 block text-sm font-bold text-eac-text">Title</label>
                            <input type="text" name="title" required th:value="${file.title}"
                                   class="w-full rounded-xl border border-eac-border px-4 py-3 text-sm focus:border-eac-red/40 focus:outline-none focus:ring-2 focus:ring-eac-red/30">
                        </div>

                        <div>
                            <label class="mb-1.5 block text-sm font-bold text-eac-text">Description</label>
                            <textarea name="description" rows="7"
                                      class="w-full rounded-xl border border-eac-border px-4 py-3 text-sm leading-6 focus:border-eac-red/40 focus:outline-none focus:ring-2 focus:ring-eac-red/30" th:text="${file.description}"></textarea>
                        </div>

                        <div class="grid gap-4 sm:grid-cols-2">
                            <div>
                                <label class="mb-1.5 block text-sm font-bold text-eac-text">Authors</label>
                                <input type="text" name="authors" th:value="${file.authors}" placeholder="e.g., Juan Dela Cruz, Maria Santos"
                                       class="w-full rounded-xl border border-eac-border px-4 py-3 text-sm focus:border-eac-red/40 focus:outline-none focus:ring-2 focus:ring-eac-red/30">
                            </div>
                            <div>
                                <label class="mb-1.5 block text-sm font-bold text-eac-text">Adviser</label>
                                <input type="text" name="adviser" th:value="${file.adviser}" placeholder="e.g., Prof. Ana Reyes"
                                       class="w-full rounded-xl border border-eac-border px-4 py-3 text-sm focus:border-eac-red/40 focus:outline-none focus:ring-2 focus:ring-eac-red/30">
                            </div>
                        </div>
                    </section>

                    <aside class="space-y-5 rounded-2xl border border-eac-border bg-eac-bg/70 p-5">
                        <div>
                            <label class="mb-1.5 block text-sm font-bold text-eac-text">Academic year</label>
                            <input type="number" name="academicYear" min="1900" max="2100" th:value="${file.academicYear}" placeholder="2026"
                                   class="w-full rounded-xl border border-eac-border px-4 py-3 text-sm focus:border-eac-red/40 focus:outline-none focus:ring-2 focus:ring-eac-red/30">
                        </div>

                        <div>
                            <label class="mb-1.5 block text-sm font-bold text-eac-text">School / Department</label>
                            <select id="departmentSelect" name="departmentId" required
                                    class="w-full rounded-xl border border-eac-border bg-white px-4 py-3 text-sm focus:border-eac-red/40 focus:outline-none focus:ring-2 focus:ring-eac-red/30">
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${file.department.id == d.id}"></option>
                            </select>
                        </div>

                        <div>
                            <label class="mb-1.5 block text-sm font-bold text-eac-text">Program</label>
                            <select id="programSelect" name="programId"
                                    class="w-full rounded-xl border border-eac-border bg-white px-4 py-3 text-sm focus:border-eac-red/40 focus:outline-none focus:ring-2 focus:ring-eac-red/30">
                                <option value="">None</option>
                                <option th:each="p : ${programs}" th:value="${p.id}" th:text="${p.code + ' - ' + p.name}" th:selected="${file.program != null and file.program.id == p.id}"></option>
                            </select>
                        </div>

                        <div>
                            <label class="mb-1.5 block text-sm font-bold text-eac-text">Course</label>
                            <select id="courseSelect" name="courseId"
                                    class="w-full rounded-xl border border-eac-border bg-white px-4 py-3 text-sm focus:border-eac-red/40 focus:outline-none focus:ring-2 focus:ring-eac-red/30">
                                <option value="">None</option>
                                <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.code + ' - ' + c.title}" th:selected="${file.course != null and file.course.id == c.id}"></option>
                            </select>
                        </div>

                        <div>
                            <label class="mb-1.5 block text-sm font-bold text-eac-text">Category</label>
                            <select name="categoryId" required
                                    class="w-full rounded-xl border border-eac-border bg-white px-4 py-3 text-sm focus:border-eac-red/40 focus:outline-none focus:ring-2 focus:ring-eac-red/30">
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${file.category.id == c.id}"></option>
                            </select>
                        </div>

                        <div>
                            <div class="mb-1.5 flex items-baseline justify-between gap-3">
                                <label class="block text-sm font-bold text-eac-text">Tags</label>
                                <span class="text-xs font-medium text-eac-text-light">Max 5, comma-separated</span>
                            </div>
                            <input type="text" name="tags" th:value="${tagsValue}" placeholder="maintenance, capstone, engineering"
                                   class="w-full rounded-xl border border-eac-border bg-white px-4 py-3 text-sm focus:border-eac-red/40 focus:outline-none focus:ring-2 focus:ring-eac-red/30">
                        </div>
                    </aside>
                </div>

                <div class="mt-7 flex flex-col-reverse gap-3 border-t border-eac-border pt-5 sm:flex-row sm:items-center sm:justify-end">
                    <a th:href="@{/files/{id}(id=${file.id},returnTo=${returnTo})}"
                       class="inline-flex items-center justify-center rounded-xl border border-eac-border px-5 py-3 text-sm font-bold text-eac-maroon transition hover:border-eac-red/40 hover:text-eac-red">Cancel</a>
                    <button type="submit"
                            class="inline-flex items-center justify-center gap-2 rounded-xl bg-eac-red px-5 py-3 text-sm font-bold text-white transition hover:bg-eac-red-hover">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
                        Save metadata
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script th:inline="javascript">
        const departmentSelect = document.getElementById('departmentSelect');
        const programSelect = document.getElementById('programSelect');
        const courseSelect = document.getElementById('courseSelect');
        const programsApiUrl = /*[[@{/api/programs}]]*/ '/api/programs';
        const coursesApiUrl = /*[[@{/api/courses}]]*/ '/api/courses';

        if (departmentSelect && programSelect && courseSelect) {
            departmentSelect.addEventListener('change', async function () {
                const departmentId = departmentSelect.value;
                programSelect.innerHTML = '<option value="">None</option>';
                courseSelect.innerHTML = '<option value="">None</option>';
                if (!departmentId) return;

                const [programs, courses] = await Promise.all([
                    fetch(programsApiUrl + '?departmentId=' + encodeURIComponent(departmentId)).then(r => r.json()),
                    fetch(coursesApiUrl + '?departmentId=' + encodeURIComponent(departmentId)).then(r => r.json())
                ]);
                for (const p of programs) {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.code + ' - ' + p.name;
                    programSelect.appendChild(opt);
                }
                for (const c of courses) {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.code + ' - ' + c.title;
                    courseSelect.appendChild(opt);
                }
            });
        }
    </script>

</body>
</html>
