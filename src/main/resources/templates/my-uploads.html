<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Uploads - EAC File Directory</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="min-h-screen bg-eac-bg">

    <header class="bg-white border-b border-eac-border relative">
        <div class="max-w-7xl mx-auto px-6 h-[72px] flex items-center justify-between">
            <a th:href="@{/home}" class="flex items-center gap-3 shrink-0">
                <img th:src="@{/images/emblem.png}" alt="EAC" class="w-10 h-10">
                <span class="font-bold text-lg text-eac-maroon whitespace-nowrap">EAC File Directory</span>
            </a>
            <nav class="hidden lg:flex items-center gap-7 text-sm font-medium">
                <a th:href="@{/browse}" class="text-eac-text hover:text-eac-red transition">Browse</a>
                <a th:href="@{/upload}" class="text-eac-text hover:text-eac-red transition">Upload</a>
                <div class="h-6 w-px bg-eac-border"></div>
                <a th:href="@{/logout}" class="bg-eac-red hover:bg-eac-red-hover transition text-white text-sm font-bold rounded-lg px-5 py-2.5">Sign Out</a>
            </nav>
            <button type="button" id="navToggle" aria-label="Toggle menu" class="lg:hidden text-eac-maroon p-2 -mr-2">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>
        </div>
        <div id="navPanel" class="hidden lg:hidden border-t border-eac-border bg-white px-6 py-4 space-y-3 text-sm font-medium">
            <a th:href="@{/browse}" class="block text-eac-text hover:text-eac-red transition">Browse</a>
            <a th:href="@{/upload}" class="block text-eac-text hover:text-eac-red transition">Upload</a>
            <a th:href="@{/logout}" class="block bg-eac-red hover:bg-eac-red-hover transition text-white text-sm font-bold rounded-lg px-5 py-2.5 text-center mt-2">Sign Out</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-10">
        <h1 class="text-2xl font-bold text-eac-navy mb-1">My Uploads</h1>
        <p class="text-eac-text-light text-sm mb-6">Track the review status of everything you've submitted.</p>

        <div th:if="${infoMessage}" class="mb-4 rounded-lg bg-green-50 border border-green-200 text-green-700 px-4 py-3 text-sm" th:text="${infoMessage}"></div>

        <div th:if="${files.empty}" class="rounded-xl border border-dashed border-eac-border bg-white p-10 text-center text-eac-text-light">
            <p class="font-medium">You haven't uploaded anything yet.</p>
            <p class="text-sm mt-1"><a th:href="@{/upload}" class="text-eac-red hover:underline">Upload your first file</a>.</p>
        </div>

        <div class="space-y-3" th:unless="${files.empty}">
            <div th:each="file : ${files.content}" class="bg-white rounded-xl border border-eac-border p-5 flex items-center justify-between gap-4">
                <div>
                    <h3 class="font-semibold text-eac-text" th:text="${file.title}"></h3>
                    <p class="text-xs text-eac-text-light mt-1" th:text="${file.category.name} + ' · ' + ${file.department.code}"></p>
                    <p th:if="${file.status.name() == 'REJECTED' and file.rejectionReason != null}"
                       class="text-xs text-red-600 mt-1" th:text="'Reason: ' + ${file.rejectionReason}"></p>
                </div>
                <span class="text-xs font-semibold px-3 py-1 rounded-full whitespace-nowrap"
                      th:classappend="${file.status.name() == 'APPROVED'} ? 'bg-green-100 text-green-700' : (${file.status.name() == 'REJECTED'} ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700')"
                      th:text="${file.status}"></span>
            </div>
        </div>
    </main>

    <script>
        var navToggle = document.getElementById('navToggle');
        var navPanel = document.getElementById('navPanel');
        if (navToggle && navPanel) {
            navToggle.addEventListener('click', function () {
                navPanel.classList.toggle('hidden');
            });
        }
    </script>

</body>
</html>
