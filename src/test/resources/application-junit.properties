# Activated via @ActiveProfiles("junit") on test classes. Deliberately a
# different name from the existing "test" profile (see DevSecurityConfig/
# DevLoginController) - that one means "dev-login bypass active" and would
# swap out the real security chain we actually want to exercise in tests.
# This profile only replaces the datasource with an in-memory H2 instance so
# JUnit runs never touch the real local MySQL eac_directory schema.

spring.datasource.url=jdbc:h2:mem:filedirectory-junit;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Never actually send mail in tests - MailService already logs+swallows send
# failures, so leaving these blank exercises that same fallback path real
# local dev without SMTP credentials hits too.
spring.mail.username=
spring.mail.password=

# Isolated storage root so tests never touch the real ./data/eac-directory folder.
eac.storage.root=./build/test-data/eac-directory

# OnlyOfficeService refuses to sign anything without a configured secret
# (see its configSigningKey()) - application.properties' ${ONLYOFFICE_JWT_SECRET:}
# default is blank absent a real .env, which would make every
# OnlyOfficeControllerTest fail with "not configured" rather than exercising
# the actual authorization logic being tested. Test-only value, never used
# outside this profile.
onlyoffice.jwt.secret=junit-test-secret-value-not-used-anywhere-real
